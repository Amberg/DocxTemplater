name: Release
permissions:
  contents: read
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet trusted publishing
    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'DocxTemplater.slnx'

    steps:
    - name: echo
      run: echo ${{ github.ref }}
      
    - uses: actions/checkout@v4 #Fetch all history for all tags and branches
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x.x
          9.x.x
          8.x.x

    - name: Restore
      run: dotnet restore $SOLUTION

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Build
      run: dotnet build $SOLUTION --configuration $BUILD_CONFIG --no-restore --no-restore /p:Version=$PACKAGE_VERSION

    - name: Run tests
      run: dotnet test -c $BUILD_CONFIG --no-restore --no-build --verbosity normal

    # The temporary API key is valid for one hour: request it right before the push.
    - name: NuGet login (trusted publishing)
      if: startsWith(github.ref, 'refs/tags/v') == true
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish
      if: startsWith(github.ref, 'refs/tags/v') == true
      run: dotnet nuget push "**/*.nupkg" -s 'https://api.nuget.org/v3/index.json' -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
